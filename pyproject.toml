[project]
name = "jurepi-imagegen"
version = "0.1.0"
description = "Dev-only local image generation for Jurepi.kr via Ollama (FLUX.2 Klein / Z-Image Turbo). NOT part of the Next.js runtime or build."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jurepi-imagegen = "imagegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imagegen"]

[tool.pytest.ini_options]
testpaths = ["imagegen/tests"]
